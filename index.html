<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presently - Presentation Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        [contenteditable]:focus { outline: none; }
        .slide-aspect { aspect-ratio: 16 / 9; }
        .animate-fade { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .selected-element { outline: 2px solid #ea580c !important; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, addDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const { useState, useEffect, useRef } = React;

        // Configuration remains the same
        const firebaseConfig = {
            apiKey: "AIzaSyDYI4Avd42wjJa3YOSKuGHhSCGgLFLZvik",
            authDomain: "presently-3babd.firebaseapp.com",
            projectId: "presently-3babd",
            storageBucket: "presently-3babd.firebasestorage.app",
            messagingSenderId: "646349632966",
            appId: "1:646349632966:web:70780e1952d3144842aec7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'presently-default';

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('loading');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [presentations, setPresentations] = useState([]);
            const [activePres, setActivePres] = useState(null);
            const [currentSlideIndex, setCurrentSlideIndex] = useState(0);
            const [selectedElementId, setSelectedElementId] = useState(null);
            const [showSlideModal, setShowSlideModal] = useState(false);

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    if (u) setView('home');
                    else setView('login');
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const q = query(collection(db, 'artifacts', appId, 'users', user.uid, 'presentations'));
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    setPresentations(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return () => unsubscribe();
            }, [user]);

            const handleAuthSubmit = async (e) => {
                e.preventDefault();
                try { await signInAnonymously(auth); } catch (err) { setError("Login failed."); }
            };

            const saveActivePres = async (updatedPres) => {
                if (!user || !updatedPres?.id) return;
                const { id, ...data } = updatedPres;
                await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'presentations', id), data);
            };

            const addSlide = (type) => {
                const updated = { ...activePres };
                const newSlide = { elements: [] };
                if (type === 'template') {
                    newSlide.elements = [
                        { id: Math.random().toString(36).substr(2, 9), type: 'text', content: 'Slide Title', x: 10, y: 15, fontSize: 48, color: '#1e293b', bold: true },
                        { id: Math.random().toString(36).substr(2, 9), type: 'text', content: 'Click to add body text...', x: 10, y: 35, fontSize: 24, color: '#64748b' }
                    ];
                }
                updated.slides.push(newSlide);
                setActivePres(updated);
                setCurrentSlideIndex(updated.slides.length - 1);
                setShowSlideModal(false);
                saveActivePres(updated);
            };

            const addElement = (type) => {
                const updated = { ...activePres };
                const newEl = {
                    id: Math.random().toString(36).substr(2, 9),
                    type,
                    content: type === 'text' ? 'New Text' : '',
                    x: 40, y: 40,
                    fontSize: 24,
                    color: type === 'text' ? '#000000' : '#ea580c'
                };
                updated.slides[currentSlideIndex].elements.push(newEl);
                setActivePres(updated);
                setSelectedElementId(newEl.id);
                saveActivePres(updated);
            };

            const updateSelectedElement = (key, value) => {
                if (!selectedElementId) return;
                const updated = { ...activePres };
                const el = updated.slides[currentSlideIndex].elements.find(e => e.id === selectedElementId);
                if (el) {
                    el[key] = value;
                    setActivePres(updated);
                    saveActivePres(updated);
                }
            };

            const deleteSelectedElement = () => {
                if (!selectedElementId) return;
                const updated = { ...activePres };
                updated.slides[currentSlideIndex].elements = updated.slides[currentSlideIndex].elements.filter(e => e.id !== selectedElementId);
                setActivePres(updated);
                setSelectedElementId(null);
                saveActivePres(updated);
            };

            const createNewPresentation = async () => {
                if (!user) return;
                const newDoc = {
                    title: "Untitled Presentation",
                    createdAt: serverTimestamp(),
                    slides: [{ elements: [{ id: '1', type: 'text', content: 'Main Title', x: 25, y: 40, fontSize: 64, bold: true, color: '#1e293b' }] }]
                };
                const docRef = await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'presentations'), newDoc);
                setActivePres({ id: docRef.id, ...newDoc });
                setView('editor');
            };

            if (view === 'loading') return <div className="h-screen flex items-center justify-center text-slate-400">Connecting...</div>;

            if (view === 'login') {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-6">
                        <div className="bg-white p-10 rounded-3xl w-full max-w-md shadow-2xl">
                            <h2 className="text-3xl font-black mb-6">Presently</h2>
                            <form onSubmit={handleAuthSubmit} className="space-y-4">
                                <input type="email" placeholder="Email" className="w-full p-3 border rounded-xl" onChange={e => setEmail(e.target.value)} />
                                <input type="password" placeholder="Password" className="w-full p-3 border rounded-xl" onChange={e => setPassword(e.target.value)} />
                                <button className="w-full bg-orange-600 text-white py-3 rounded-xl font-bold">Start Designing</button>
                            </form>
                            <p className="mt-4 text-xs text-slate-400">Note: Anonymous login is enabled for testing.</p>
                        </div>
                    </div>
                );
            }

            if (view === 'editor' && activePres) {
                const currentSlide = activePres.slides[currentSlideIndex];
                const selectedEl = currentSlide.elements.find(e => e.id === selectedElementId);

                return (
                    <div className="h-screen flex flex-col bg-slate-100 overflow-hidden">
                        {/* Header */}
                        <header className="h-14 bg-white border-b flex items-center justify-between px-4 shrink-0">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setView('home')} className="p-2 hover:bg-slate-100 rounded-lg"><Icon name="arrow-left"/></button>
                                <input className="font-bold outline-none border-b border-transparent focus:border-orange-500" value={activePres.title} onChange={e => {
                                    const up = {...activePres, title: e.target.value};
                                    setActivePres(up); saveActivePres(up);
                                }} />
                            </div>
                            <button className="bg-slate-900 text-white px-4 py-1.5 rounded-lg text-sm font-bold">Present</button>
                        </header>

                        {/* Formatting Bar */}
                        <div className="h-12 bg-white border-b flex items-center px-4 gap-4 shrink-0">
                            <button onClick={() => setShowSlideModal(true)} className="flex items-center gap-1 text-xs font-bold text-orange-600 bg-orange-50 px-3 py-1.5 rounded-lg hover:bg-orange-100">
                                <Icon name="plus" size={14}/> NEW SLIDE
                            </button>
                            <div className="h-6 w-px bg-slate-200 mx-2" />
                            <button onClick={() => addElement('text')} className="p-2 hover:bg-slate-100 rounded-lg" title="Add Text"><Icon name="type" size={18}/></button>
                            <button onClick={() => addElement('square')} className="p-2 hover:bg-slate-100 rounded-lg" title="Add Square"><Icon name="square" size={18}/></button>
                            <button onClick={() => addElement('circle')} className="p-2 hover:bg-slate-100 rounded-lg" title="Add Circle"><Icon name="circle" size={18}/></button>
                            
                            {selectedEl && (
                                <div className="flex items-center gap-3 ml-auto animate-fade">
                                    {selectedEl.type === 'text' && (
                                        <>
                                            <input type="number" className="w-16 border rounded px-2 py-1 text-sm" value={selectedEl.fontSize} onChange={e => updateSelectedElement('fontSize', parseInt(e.target.value))} />
                                            <input type="color" className="w-8 h-8 rounded cursor-pointer" value={selectedEl.color || '#000000'} onChange={e => updateSelectedElement('color', e.target.value)} />
                                            <button onClick={() => updateSelectedElement('bold', !selectedEl.bold)} className={`p-2 rounded ${selectedEl.bold ? 'bg-orange-100 text-orange-600' : 'hover:bg-slate-100'}`}><Icon name="bold" size={16}/></button>
                                        </>
                                    )}
                                    {selectedEl.type !== 'text' && (
                                        <input type="color" className="w-8 h-8 rounded cursor-pointer" value={selectedEl.color || '#ea580c'} onChange={e => updateSelectedElement('color', e.target.value)} />
                                    )}
                                    <button onClick={deleteSelectedElement} className="p-2 hover:bg-red-50 text-red-500 rounded-lg"><Icon name="trash-2" size={18}/></button>
                                </div>
                            )}
                        </div>

                        <div className="flex-1 flex overflow-hidden">
                            {/* Thumbnails */}
                            <aside className="w-48 bg-white border-r overflow-y-auto p-4 space-y-4 shrink-0 shadow-inner">
                                {activePres.slides.map((s, i) => (
                                    <div key={i} onClick={() => {setCurrentSlideIndex(i); setSelectedElementId(null);}} className={`cursor-pointer rounded-lg overflow-hidden border-2 transition-all ${currentSlideIndex === i ? 'border-orange-500 ring-2 ring-orange-100' : 'border-slate-200 hover:border-slate-300'}`}>
                                        <div className="slide-aspect bg-slate-50 flex items-center justify-center text-xs font-bold text-slate-400">{i + 1}</div>
                                    </div>
                                ))}
                            </aside>

                            {/* Canvas */}
                            <main className="flex-1 p-12 flex items-center justify-center overflow-auto bg-slate-200" onClick={() => setSelectedElementId(null)}>
                                <div className="w-full max-w-4xl slide-aspect bg-white shadow-2xl relative overflow-hidden" onClick={e => e.stopPropagation()}>
                                    {currentSlide.elements.map(el => (
                                        <div 
                                            key={el.id} 
                                            onClick={(e) => { e.stopPropagation(); setSelectedElementId(el.id); }}
                                            style={{ 
                                                left: `${el.x}%`, 
                                                top: `${el.y}%`, 
                                                fontSize: `${el.fontSize}px`, 
                                                color: el.color,
                                                fontWeight: el.bold ? '800' : '400',
                                                zIndex: selectedElementId === el.id ? 10 : 1
                                            }} 
                                            className={`absolute cursor-move p-2 transition-shadow ${selectedElementId === el.id ? 'selected-element shadow-xl' : 'hover:outline hover:outline-1 hover:outline-slate-300'}`}
                                        >
                                            {el.type === 'text' ? (
                                                <div 
                                                    contentEditable 
                                                    suppressContentEditableWarning 
                                                    onBlur={e => {
                                                        const up = {...activePres};
                                                        up.slides[currentSlideIndex].elements.find(item => item.id === el.id).content = e.target.innerText;
                                                        setActivePres(up); saveActivePres(up);
                                                    }}
                                                    className="min-w-[50px] outline-none"
                                                >
                                                    {el.content}
                                                </div>
                                            ) : (
                                                <div 
                                                    style={{ backgroundColor: el.color || '#ea580c', borderRadius: el.type === 'circle' ? '50%' : '8px' }} 
                                                    className="w-24 h-24 opacity-80" 
                                                />
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </main>
                        </div>

                        {/* New Slide Modal */}
                        {showSlideModal && (
                            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-6">
                                <div className="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl animate-fade">
                                    <h3 className="text-xl font-black mb-6">Choose Slide Layout</h3>
                                    <div className="grid grid-cols-2 gap-4">
                                        <button onClick={() => addSlide('blank')} className="p-6 border-2 border-slate-100 rounded-2xl hover:border-orange-500 hover:bg-orange-50 transition-all flex flex-col items-center gap-3">
                                            <div className="w-full aspect-video bg-slate-100 rounded border border-dashed border-slate-300"></div>
                                            <span className="font-bold text-sm">Blank</span>
                                        </button>
                                        <button onClick={() => addSlide('template')} className="p-6 border-2 border-slate-100 rounded-2xl hover:border-orange-500 hover:bg-orange-50 transition-all flex flex-col items-center gap-3">
                                            <div className="w-full aspect-video bg-slate-100 rounded p-2 flex flex-col gap-1">
                                                <div className="h-2 w-3/4 bg-slate-300 rounded"></div>
                                                <div className="h-1 w-1/2 bg-slate-200 rounded"></div>
                                            </div>
                                            <span className="font-bold text-sm">Template</span>
                                        </button>
                                    </div>
                                    <button onClick={() => setShowSlideModal(false)} className="mt-6 w-full py-3 text-slate-400 font-bold hover:text-slate-600">Cancel</button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // Dashboard View
            return (
                <div className="min-h-screen flex w-full bg-slate-50">
                    <aside className="w-64 bg-white border-r p-8 flex flex-col shrink-0">
                        <div className="text-2xl font-black text-orange-600 mb-12 flex items-center gap-2">
                             <Icon name="presentation" size={28}/> Presently
                        </div>
                        <button className="flex items-center gap-3 bg-orange-600 text-white p-3 rounded-xl font-bold shadow-lg shadow-orange-200 hover:scale-105 transition-transform" onClick={createNewPresentation}>
                            <Icon name="plus" size={20}/> New Project
                        </button>
                        <div className="mt-auto pt-4 border-t">
                            <button onClick={() => signOut(auth)} className="text-slate-400 font-bold text-sm hover:text-red-500">Sign Out</button>
                        </div>
                    </aside>
                    <main className="flex-1 p-12 overflow-y-auto">
                        <h1 className="text-3xl font-black mb-8">Your Projects</h1>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {presentations.map(p => (
                                <div key={p.id} onClick={() => {setActivePres(p); setView('editor');}} className="group bg-white p-4 rounded-3xl border border-slate-100 shadow-sm hover:shadow-xl transition-all cursor-pointer">
                                    <div className="aspect-video bg-slate-50 rounded-2xl mb-4 flex items-center justify-center text-slate-200 group-hover:bg-orange-50 group-hover:text-orange-200 transition-colors">
                                        <Icon name="presentation" size={48}/>
                                    </div>
                                    <div className="flex items-center justify-between">
                                        <h3 className="font-bold text-slate-800 truncate pr-4">{p.title}</h3>
                                        <button onClick={(e) => {
                                            e.stopPropagation();
                                            deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'presentations', p.id));
                                        }} className="p-2 text-slate-300 hover:text-red-500"><Icon name="trash-2" size={16}/></button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
