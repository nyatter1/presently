<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presently - Presentation Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        [contenteditable]:focus { outline: none; }
        .slide-aspect { aspect-ratio: 16 / 9; }
        .animate-fade { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .element-selected { outline: 2px solid #ea580c !important; }
        .resize-handle { width: 10px; height: 10px; background: white; border: 2px solid #ea580c; position: absolute; border-radius: 50%; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, addDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const { useState, useEffect, useRef, useCallback } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDYI4Avd42wjJa3YOSKuGHhSCGgLFLZvik",
            authDomain: "presently-3babd.firebaseapp.com",
            projectId: "presently-3babd",
            storageBucket: "presently-3babd.firebasestorage.app",
            messagingSenderId: "646349632966",
            appId: "1:646349632966:web:70780e1952d3144842aec7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'presently-default';

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('loading');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [presentations, setPresentations] = useState([]);
            const [activePres, setActivePres] = useState(null);
            const [currentSlideIndex, setCurrentSlideIndex] = useState(0);
            const [selectedElementId, setSelectedElementId] = useState(null);
            const [isPresenting, setIsPresenting] = useState(false);
            const [showNewSlideMenu, setShowNewSlideMenu] = useState(false);

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    if (u) setView('home');
                    else setView('login');
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const q = query(collection(db, 'artifacts', appId, 'users', user.uid, 'presentations'));
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    setPresentations(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                }, (err) => console.error("Firestore sync error", err));
                return () => unsubscribe();
            }, [user]);

            const handleAuthSubmit = async (e) => {
                e.preventDefault();
                setError('');
                try {
                    await signInAnonymously(auth);
                } catch (err) {
                    setError("Auth failed. Check Firebase console.");
                }
            };

            const createNewPresentation = async () => {
                if (!user) return;
                const newDoc = {
                    title: "Untitled Presentation",
                    createdAt: serverTimestamp(),
                    slides: [{ 
                        elements: [
                            { id: '1', type: 'text', content: 'Double click to edit title', x: 10, y: 35, width: 80, height: 15, fontSize: 48, bold: true, color: '#1e293b' },
                            { id: '2', type: 'text', content: 'Subtitle goes here', x: 10, y: 52, width: 80, height: 10, fontSize: 24, color: '#64748b' }
                        ] 
                    }]
                };
                const docRef = await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'presentations'), newDoc);
                openPresentation({ id: docRef.id, ...newDoc });
            };

            const openPresentation = (pres) => {
                setActivePres(pres);
                setCurrentSlideIndex(0);
                setSelectedElementId(null);
                setView('editor');
            };

            const updateActivePres = (updated) => {
                setActivePres(updated);
                if (user && updated.id) {
                    const { id, ...data } = updated;
                    updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'presentations', id), data);
                }
            };

            const addSlide = (type = 'blank') => {
                const updated = { ...activePres };
                const newSlide = { elements: [] };
                if (type === 'template') {
                    newSlide.elements = [
                        { id: Math.random().toString(36).substr(2, 9), type: 'text', content: 'Slide Title', x: 5, y: 5, width: 90, height: 10, fontSize: 32, bold: true, color: '#1e293b' },
                        { id: Math.random().toString(36).substr(2, 9), type: 'text', content: 'Add your content here...', x: 5, y: 20, width: 90, height: 60, fontSize: 18, color: '#334155' }
                    ];
                }
                updated.slides.push(newSlide);
                updateActivePres(updated);
                setCurrentSlideIndex(updated.slides.length - 1);
                setShowNewSlideMenu(false);
            };

            const deleteSlide = (idx) => {
                if (activePres.slides.length <= 1) return;
                const updated = { ...activePres };
                updated.slides.splice(idx, 1);
                const newIdx = Math.max(0, currentSlideIndex >= updated.slides.length ? updated.slides.length - 1 : currentSlideIndex);
                setCurrentSlideIndex(newIdx);
                updateActivePres(updated);
            };

            const addElement = (type) => {
                const updated = { ...activePres };
                const id = Math.random().toString(36).substr(2, 9);
                const el = {
                    id, type,
                    x: 40, y: 40, width: type === 'text' ? 20 : 15, height: type === 'text' ? 10 : 15,
                    content: type === 'text' ? 'New Text' : '',
                    fontSize: type === 'text' ? 20 : undefined,
                    color: type === 'text' ? '#1e293b' : '#fb923c',
                    bold: false
                };
                updated.slides[currentSlideIndex].elements.push(el);
                updateActivePres(updated);
                setSelectedElementId(id);
            };

            const updateElement = (id, fields) => {
                const updated = { ...activePres };
                const slide = updated.slides[currentSlideIndex];
                const elIdx = slide.elements.findIndex(el => el.id === id);
                if (elIdx > -1) {
                    slide.elements[elIdx] = { ...slide.elements[elIdx], ...fields };
                    updateActivePres(updated);
                }
            };

            const deleteElement = (id) => {
                const updated = { ...activePres };
                updated.slides[currentSlideIndex].elements = updated.slides[currentSlideIndex].elements.filter(el => el.id !== id);
                updateActivePres(updated);
                setSelectedElementId(null);
            };

            const handleElementDrag = (e, id) => {
                const slideRect = e.currentTarget.closest('.slide-container').getBoundingClientRect();
                const startX = e.clientX;
                const startY = e.clientY;
                const el = activePres.slides[currentSlideIndex].elements.find(i => i.id === id);
                const initialX = el.x;
                const initialY = el.y;

                const onMove = (moveEvent) => {
                    const dx = ((moveEvent.clientX - startX) / slideRect.width) * 100;
                    const dy = ((moveEvent.clientY - startY) / slideRect.height) * 100;
                    updateElement(id, { x: initialX + dx, y: initialY + dy });
                };

                const onUp = () => {
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                };

                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
            };

            const handleElementResize = (e, id) => {
                e.stopPropagation();
                const slideRect = e.currentTarget.closest('.slide-container').getBoundingClientRect();
                const startX = e.clientX;
                const startY = e.clientY;
                const el = activePres.slides[currentSlideIndex].elements.find(i => i.id === id);
                const initialW = el.width;
                const initialH = el.height;

                const onMove = (moveEvent) => {
                    const dw = ((moveEvent.clientX - startX) / slideRect.width) * 100;
                    const dh = ((moveEvent.clientY - startY) / slideRect.height) * 100;
                    updateElement(id, { width: Math.max(2, initialW + dw), height: Math.max(2, initialH + dh) });
                };

                const onUp = () => {
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                };

                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
            };

            // Presentation Keyboard Listeners
            useEffect(() => {
                const handleKey = (e) => {
                    if (isPresenting) {
                        if (e.key === 'ArrowRight' || e.key === ' ') setCurrentSlideIndex(p => Math.min(p + 1, activePres.slides.length - 1));
                        if (e.key === 'ArrowLeft') setCurrentSlideIndex(p => Math.max(p - 1, 0));
                        if (e.key === 'Escape') setIsPresenting(false);
                    } else if (selectedElementId && e.key === 'Delete') {
                        deleteElement(selectedElementId);
                    }
                };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, [isPresenting, activePres, selectedElementId]);

            if (view === 'loading') return <div className="h-screen flex items-center justify-center text-slate-400 font-medium">Connecting...</div>;

            if (view === 'login' || view === 'signup') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-900">
                        <div className="max-w-md w-full bg-white rounded-3xl p-10 shadow-2xl animate-fade">
                            <div className="flex items-center gap-3 mb-8 text-orange-600">
                                <Icon name="presentation" size={32} />
                                <span className="text-2xl font-extrabold tracking-tight text-slate-900">Presently</span>
                            </div>
                            <h2 className="text-2xl font-bold text-slate-800 mb-6">Welcome back</h2>
                            <form onSubmit={handleAuthSubmit} className="space-y-4">
                                <input type="email" placeholder="Email" className="w-full px-4 py-3 rounded-xl border outline-none focus:ring-2 focus:ring-orange-500" value={email} onChange={e => setEmail(e.target.value)} />
                                <input type="password" placeholder="Password" className="w-full px-4 py-3 rounded-xl border outline-none focus:ring-2 focus:ring-orange-500" value={password} onChange={e => setPassword(e.target.value)} />
                                <button type="submit" className="w-full bg-orange-600 text-white font-bold py-3.5 rounded-xl hover:bg-orange-700 transition-all">Sign In Anonymously</button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (view === 'editor' && activePres) {
                const currentSlide = activePres.slides[currentSlideIndex];
                const selectedElement = currentSlide.elements.find(el => el.id === selectedElementId);

                return (
                    <div className="h-screen flex flex-col bg-slate-100 overflow-hidden">
                        {/* Presentation Mode */}
                        {isPresenting && (
                            <div className="fixed inset-0 bg-black z-[100] flex items-center justify-center cursor-none group">
                                <div className="w-full h-full flex items-center justify-center p-4">
                                    <div className="w-full max-w-[90vw] slide-aspect bg-white relative overflow-hidden shadow-2xl">
                                        {currentSlide.elements.map(el => (
                                            <div key={el.id} style={{ left: `${el.x}%`, top: `${el.y}%`, width: `${el.width}%`, height: `${el.height}%`, fontSize: el.fontSize ? `${(el.fontSize / 100) * 10}vw` : 'inherit', color: el.color }} className="absolute flex items-center">
                                                {el.type === 'text' ? <div className={`${el.bold ? 'font-bold' : ''}`}>{el.content}</div> : 
                                                 el.type === 'circle' ? <div className="w-full h-full rounded-full" style={{ backgroundColor: el.color }} /> :
                                                 <div className="w-full h-full" style={{ backgroundColor: el.color }} />}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="absolute bottom-4 left-1/2 -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-opacity flex gap-4 text-white/50 text-xs uppercase font-bold tracking-widest bg-black/40 px-4 py-2 rounded-full">
                                    Slide {currentSlideIndex + 1} of {activePres.slides.length} • Esc to exit
                                </div>
                            </div>
                        )}

                        <header className="bg-white border-b px-6 h-14 flex items-center justify-between shrink-0">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setView('home')} className="p-2 hover:bg-slate-100 rounded-lg"><Icon name="arrow-left" size={18} /></button>
                                <input 
                                    className="font-bold text-slate-800 bg-transparent outline-none focus:ring-1 focus:ring-orange-200 rounded px-2"
                                    value={activePres.title}
                                    onChange={(e) => updateActivePres({...activePres, title: e.target.value})}
                                />
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setIsPresenting(true)} className="bg-orange-600 text-white px-4 py-1.5 rounded-lg text-sm font-bold flex items-center gap-2 hover:bg-orange-700 shadow-sm"><Icon name="play" size={14} /> Present</button>
                            </div>
                        </header>

                        {/* Toolbar */}
                        <div className="bg-white border-b px-6 py-2 flex items-center gap-4 shrink-0 overflow-x-auto">
                            <div className="relative">
                                <button onClick={() => setShowNewSlideMenu(!showNewSlideMenu)} className="flex items-center gap-2 px-3 py-1.5 hover:bg-slate-50 border rounded-lg text-sm font-bold text-slate-600">
                                    <Icon name="plus" size={16} /> Add Slide <Icon name="chevron-down" size={14} />
                                </button>
                                {showNewSlideMenu && (
                                    <div className="absolute top-full left-0 mt-2 w-48 bg-white border rounded-xl shadow-xl z-50 p-2 animate-fade">
                                        <button onClick={() => addSlide('blank')} className="w-full text-left px-4 py-2 hover:bg-slate-50 rounded-lg text-sm font-medium">Blank Slide</button>
                                        <button onClick={() => addSlide('template')} className="w-full text-left px-4 py-2 hover:bg-slate-50 rounded-lg text-sm font-medium">Title & Content Template</button>
                                    </div>
                                )}
                            </div>
                            <div className="h-6 w-px bg-slate-200 mx-2" />
                            <button onClick={() => addElement('text')} className="p-2 hover:bg-slate-50 rounded-lg flex flex-col items-center gap-1 group">
                                <Icon name="type" size={18} className="text-slate-500 group-hover:text-orange-600" />
                                <span className="text-[10px] text-slate-400 font-bold group-hover:text-slate-600">TEXT</span>
                            </button>
                            <button onClick={() => addElement('square')} className="p-2 hover:bg-slate-50 rounded-lg flex flex-col items-center gap-1 group">
                                <Icon name="square" size={18} className="text-slate-500 group-hover:text-orange-600" />
                                <span className="text-[10px] text-slate-400 font-bold group-hover:text-slate-600">SQUARE</span>
                            </button>
                            <button onClick={() => addElement('circle')} className="p-2 hover:bg-slate-50 rounded-lg flex flex-col items-center gap-1 group">
                                <Icon name="circle" size={18} className="text-slate-500 group-hover:text-orange-600" />
                                <span className="text-[10px] text-slate-400 font-bold group-hover:text-slate-600">CIRCLE</span>
                            </button>

                            {selectedElement && (
                                <>
                                    <div className="h-6 w-px bg-slate-200 mx-2" />
                                    {selectedElement.type === 'text' && (
                                        <div className="flex items-center gap-2">
                                            <input type="number" className="w-16 border rounded px-2 py-1 text-sm outline-none focus:ring-1 focus:ring-orange-500" value={selectedElement.fontSize} onChange={(e) => updateElement(selectedElementId, { fontSize: parseInt(e.target.value) || 12 })} />
                                            <button onClick={() => updateElement(selectedElementId, { bold: !selectedElement.bold })} className={`p-1.5 rounded ${selectedElement.bold ? 'bg-orange-100 text-orange-600' : 'hover:bg-slate-50'}`}><Icon name="bold" size={16} /></button>
                                        </div>
                                    )}
                                    <div className="flex items-center gap-1">
                                        {['#1e293b', '#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#8b5cf6', '#ec4899'].map(c => (
                                            <button key={c} onClick={() => updateElement(selectedElementId, { color: c })} className={`w-5 h-5 rounded-full border border-black/10 transition-transform hover:scale-125 ${selectedElement.color === c ? 'ring-2 ring-white ring-offset-2 ring-offset-slate-400' : ''}`} style={{ backgroundColor: c }} />
                                        ))}
                                    </div>
                                    <button onClick={() => deleteElement(selectedElementId)} className="ml-2 p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg"><Icon name="trash-2" size={18} /></button>
                                </>
                            )}
                        </div>

                        <div className="flex-1 flex overflow-hidden">
                            {/* Slide Sorter */}
                            <aside className="w-56 bg-white border-r overflow-y-auto p-4 flex flex-col gap-4 shadow-inner">
                                {activePres.slides.map((slide, idx) => (
                                    <div key={idx} className="relative group">
                                        <div onClick={() => setCurrentSlideIndex(idx)} className={`w-full slide-aspect bg-slate-50 border rounded-xl overflow-hidden cursor-pointer transition-all ${currentSlideIndex === idx ? 'ring-2 ring-orange-500 shadow-md' : 'hover:bg-slate-100 border-slate-200'}`}>
                                            <div className="w-full h-full scale-[0.2] origin-top-left relative">
                                                {slide.elements.map(el => (
                                                    <div key={el.id} style={{ left: `${el.x}%`, top: `${el.y}%`, width: `${el.width}%`, height: `${el.height}%`, backgroundColor: el.type !== 'text' ? el.color : 'transparent', color: el.color, fontSize: `${el.fontSize}px` }} className={`absolute ${el.type === 'circle' ? 'rounded-full' : ''}`}>
                                                        {el.type === 'text' && el.content}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="mt-1 flex justify-between items-center px-2">
                                            <span className="text-[10px] font-bold text-slate-400">{idx + 1}</span>
                                            <button onClick={(e) => { e.stopPropagation(); deleteSlide(idx); }} className="opacity-0 group-hover:opacity-100 p-1 hover:text-red-500 transition-opacity"><Icon name="x" size={12} /></button>
                                        </div>
                                    </div>
                                ))}
                            </aside>

                            {/* Main Stage */}
                            <main className="flex-1 bg-slate-100 p-8 flex items-center justify-center overflow-auto scrollbar-hide" onClick={() => setSelectedElementId(null)}>
                                <div className="slide-container w-full max-w-5xl slide-aspect bg-white shadow-[0_30px_60px_-15px_rgba(0,0,0,0.1)] relative border border-slate-200 rounded-sm overflow-hidden animate-fade">
                                    {currentSlide.elements.map((el) => (
                                        <div 
                                            key={el.id} 
                                            onMouseDown={(e) => { e.stopPropagation(); setSelectedElementId(el.id); handleElementDrag(e, el.id); }}
                                            style={{ 
                                                left: `${el.x}%`, 
                                                top: `${el.y}%`, 
                                                width: `${el.width}%`, 
                                                height: `${el.height}%`, 
                                                color: el.color,
                                                fontSize: el.fontSize ? `${el.fontSize}px` : 'inherit',
                                                zIndex: selectedElementId === el.id ? 10 : 1
                                            }} 
                                            className={`absolute cursor-move flex items-center group ${selectedElementId === el.id ? 'element-selected' : 'hover:outline hover:outline-1 hover:outline-slate-300'}`}
                                        >
                                            {el.type === 'text' && (
                                                <div 
                                                    className={`w-full h-full outline-none p-2 ${el.bold ? 'font-bold' : ''}`}
                                                    contentEditable 
                                                    suppressContentEditableWarning
                                                    onInput={(e) => updateElement(el.id, { content: e.currentTarget.innerText })}
                                                    onMouseDown={e => e.stopPropagation()}
                                                >
                                                    {el.content}
                                                </div>
                                            )}
                                            {el.type === 'square' && <div className="w-full h-full" style={{ backgroundColor: el.color }} />}
                                            {el.type === 'circle' && <div className="w-full h-full rounded-full" style={{ backgroundColor: el.color }} />}
                                            
                                            {selectedElementId === el.id && (
                                                <div 
                                                    className="resize-handle bottom-0 right-0 cursor-se-resize -mr-1 -mb-1"
                                                    onMouseDown={(e) => handleElementResize(e, el.id)}
                                                />
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </main>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-50 flex animate-fade">
                    <aside className="w-64 bg-slate-900 hidden lg:flex flex-col p-6 text-white shrink-0">
                        <div className="flex items-center gap-3 text-orange-500 mb-12 font-black text-2xl italic tracking-tighter">
                            <Icon name="presentation" size={32} /> Presently
                        </div>
                        <nav className="space-y-1 flex-1">
                            <button className="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold bg-white/10 text-white"><Icon name="layout" size={18} /> Projects</button>
                            <button className="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-slate-400 hover:bg-white/5 transition-all"><Icon name="shared-2" size={18} /> Shared</button>
                            <button className="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-slate-400 hover:bg-white/5 transition-all"><Icon name="trash" size={18} /> Trash</button>
                        </nav>
                        <div className="mt-auto pt-6 border-t border-white/10 flex items-center gap-3">
                            <div className="h-10 w-10 bg-orange-600 rounded-full flex items-center justify-center font-bold">U</div>
                            <div className="flex-1 min-w-0">
                                <p className="text-sm font-bold truncate">User_{auth.currentUser?.uid.slice(0, 4)}</p>
                                <button onClick={() => signOut(auth)} className="text-[10px] text-slate-400 font-bold hover:text-white uppercase tracking-widest">Logout</button>
                            </div>
                        </div>
                    </aside>

                    <div className="flex-1 flex flex-col h-screen overflow-hidden">
                        <header className="px-10 py-6 flex items-center justify-between">
                            <h1 className="text-2xl font-black text-slate-800 tracking-tight">Presentations</h1>
                            <button onClick={createNewPresentation} className="bg-orange-600 text-white px-6 py-3 rounded-2xl text-sm font-bold flex items-center gap-2 shadow-lg hover:shadow-orange-500/20 hover:-translate-y-0.5 transition-all active:scale-95">
                                <Icon name="plus" size={18} /> Create New
                            </button>
                        </header>

                        <main className="flex-1 overflow-y-auto px-10 pb-10">
                            {presentations.length === 0 ? (
                                <div className="h-[60vh] flex flex-col items-center justify-center text-center opacity-50">
                                    <Icon name="ghost" size={64} className="mb-4 text-slate-200" />
                                    <p className="font-bold text-slate-400">Empty workspace</p>
                                    <p className="text-sm text-slate-300">Start your first story today.</p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                                    {presentations.map(p => (
                                        <div key={p.id} onClick={() => openPresentation(p)} className="bg-white border rounded-[2rem] p-4 cursor-pointer hover:shadow-2xl hover:border-orange-200 transition-all group animate-fade relative overflow-hidden">
                                            <div className="slide-aspect bg-slate-50 rounded-2xl mb-4 flex items-center justify-center text-slate-200 group-hover:text-orange-200 transition-colors relative overflow-hidden">
                                                <Icon name="presentation" size={48} />
                                                <div className="absolute inset-0 bg-orange-600/0 group-hover:bg-orange-600/5 transition-colors" />
                                            </div>
                                            <div className="px-2 pb-2 flex justify-between items-start">
                                                <div>
                                                    <h3 className="font-extrabold text-slate-800 truncate text-lg leading-tight">{p.title || 'Untitled'}</h3>
                                                    <p className="text-[10px] text-slate-400 font-bold uppercase mt-1 tracking-widest">{p.slides?.length || 0} Slides</p>
                                                </div>
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'presentations', p.id)); }} 
                                                    className="opacity-0 group-hover:opacity-100 p-2 hover:bg-red-50 text-slate-300 hover:text-red-500 rounded-xl transition-all"
                                                >
                                                    <Icon name="trash-2" size={18} />
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
